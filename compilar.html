<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Compilar alvo</title></head>
<body style="font-family:Arial;background:#111;color:#fff;padding:20px">
<h2>Compilando alvo de RA…</h2><div id="st">iniciando</div>
<img id="img" src="alvo.png" style="max-width:200px;display:block;margin-top:10px">
<script type="module">
  const st = document.getElementById('st');
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
    const Compiler = (mod && mod.Compiler) || (window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler);
    const img = document.getElementById('img'); await img.decode();
    const c = new Compiler();
    await c.compileImageTargets([img], p => st.textContent = 'progresso: ' + p.toFixed(1) + '%');
    const buf = await c.exportData();
    let bin = ''; const u = new Uint8Array(buf);
    for (let i = 0; i < u.length; i += 8192) bin += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
    window.MIND_B64 = btoa(bin);
    st.textContent = 'PRONTO: ' + u.length + ' bytes';
  } catch (e) { st.textContent = 'ERRO: ' + e; window.MIND_ERR = String(e); }
</script></body></html>
