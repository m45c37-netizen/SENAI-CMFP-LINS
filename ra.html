<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Peça sobre o QR Code – SENAI CMFP Lins</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family:"Segoe UI", Arial, sans-serif; background:transparent; }
  /* o vídeo da câmera fica atrás da cena (z-index negativo do MindAR): nada pode ter fundo opaco */
  .topo { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; gap:10px;
          padding:12px 14px; color:#fff; background:linear-gradient(#000c,#0000); }
  .tag { background:#E30613; font-weight:800; padding:5px 9px; border-radius:6px; font-size:14px; }
  #dica { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); z-index:10; width:88%; max-width:420px;
          background:#000c; color:#fff; border-left:5px solid #E30613; border-radius:10px; padding:14px 16px;
          text-align:center; font-size:17px; font-weight:600; transition:opacity .3s; }
  #carregando { position:fixed; inset:0; z-index:20; background:#0d0d0d; color:#fff; display:flex; flex-direction:column;
                align-items:center; justify-content:center; text-align:center; padding:30px; }
  #carregando .icone { width:100px; height:100px; border-radius:24px; background:#E30613; display:flex;
                       align-items:center; justify-content:center; font:900 42px Arial; margin-bottom:22px; }
  #carregando p { color:#ccc; font-size:17px; }
</style>
</head>
<body>
<div class="topo"><span class="tag">SENAI</span><b style="color:#fff">CMFP Lins • Realidade Aumentada</b></div>
<div id="dica">Aponte a câmera para o <b>QR Code impresso</b><br><small>1 dedo: girar • 2 dedos: aumentar/diminuir</small></div>
<div id="carregando">
  <div class="icone">3D</div>
  <h2>ABRINDO A CÂMERA…</h2>
  <p>Se o celular perguntar, toque em <b>"Permitir"</b>.<br>(só na primeira vez)</p>
</div>

<a-scene mindar-image="imageTargetSrc: alvo.mind; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
         color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">
  <a-assets><a-asset-item id="peca" src="peca.glb"></a-asset-item></a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- largura da arte impressa = 1 unidade; o QR fica no centro (y ≈ -0,03) -->
  <a-entity id="alvo" mindar-image-target="targetIndex: 0">
    <a-entity position="0 -0.03 0" rotation="90 0 0">
      <a-entity id="giro">
        <a-gltf-model id="modelo" src="#peca" scale="1 1 1"></a-gltf-model>
      </a-entity>
    </a-entity>
  </a-entity>

  <a-entity light="type: ambient; intensity: 1.2"></a-entity>
  <a-entity light="type: directional; intensity: 2.5" position="0.5 1 2"></a-entity>
</a-scene>

<script>
  // ===== Ambiente de luz (reflexos do metal, como no visualizador 3D) =====
  function criarAmbiente(renderer) {
    const THREE = AFRAME.THREE;
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
    const g = cv.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 256);           // céu claro → horizonte → chão
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.45, '#d9d9d9');
    grad.addColorStop(0.55, '#8a8a8a'); grad.addColorStop(1, '#3a3a3a');
    g.fillStyle = grad; g.fillRect(0, 0, 512, 256);
    g.fillStyle = 'rgba(255,255,255,0.95)';                       // "janelas" de luz para brilho
    [[60,40,90,60],[250,30,70,50],[400,45,80,55]].forEach(r => g.fillRect(...r));
    const tex = new THREE.CanvasTexture(cv); tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    const pmrem = new THREE.PMREMGenerator(renderer);
    return pmrem.fromEquirectangular(tex).texture;
  }
  const modelo = document.getElementById('modelo');
  modelo.addEventListener('model-loaded', () => {
    const cenaEl = document.querySelector('a-scene');
    const aplicar = () => {
      const env = criarAmbiente(cenaEl.renderer);
      modelo.getObject3D('mesh').traverse(o => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => { m.envMap = env; m.envMapIntensity = 1.2; m.needsUpdate = true; });
        }
      });
    };
    if (cenaEl.renderer) aplicar(); else cenaEl.addEventListener('renderstart', aplicar);
  });

  // ===== Gestos: 1 dedo gira, 2 dedos (pinça) aumenta/diminui =====
  const giro = document.getElementById('giro');
  let angulo = 0, escala = 1, ultX = null, distIni = null, escIni = 1;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  window.addEventListener('touchstart', e => {
    if (e.touches.length === 1) ultX = e.touches[0].clientX;
    if (e.touches.length === 2) { distIni = dist(e.touches); escIni = escala; }
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && ultX !== null) {
      angulo += (e.touches[0].clientX - ultX) * 0.6; ultX = e.touches[0].clientX;
      giro.object3D.rotation.y = AFRAME.THREE.MathUtils.degToRad(angulo);
    } else if (e.touches.length === 2 && distIni) {
      escala = Math.min(4, Math.max(0.3, escIni * dist(e.touches) / distIni));
      giro.object3D.scale.set(escala, escala, escala);
    }
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('touchend', e => { if (e.touches.length === 0) { ultX = null; distIni = null; } });

  const dica = document.getElementById('dica');
  const alvo = document.getElementById('alvo');
  alvo.addEventListener('targetFound', () => dica.style.opacity = 0);
  alvo.addEventListener('targetLost',  () => dica.style.opacity = 1);
  const cena = document.querySelector('a-scene');
  cena.addEventListener('arReady', () => document.getElementById('carregando').style.display = 'none');
  // garante a câmera visível atrás da peça (sem mexer no tamanho/posição que o MindAR calcula)
  function mostrarAmbiente() {
    document.documentElement.style.background = 'transparent';
    document.body.style.background = 'transparent';
    const v = document.querySelector('video'), c = document.querySelector('canvas.a-canvas');
    if (v) { v.style.zIndex = '0'; v.style.display = 'block'; }
    if (c) { c.style.position = 'absolute'; c.style.zIndex = '1'; c.style.background = 'transparent'; }
    if (cena.renderer) cena.renderer.setClearColor(0x000000, 0);
    if (cena.object3D) cena.object3D.background = null;
  }
  cena.addEventListener('arReady', mostrarAmbiente);
  const vigia = setInterval(() => {            // segurança: roda assim que o vídeo da câmera começar
    const v = document.querySelector('video');
    if (v && v.readyState >= 2) { document.getElementById('carregando').style.display = 'none'; mostrarAmbiente(); clearInterval(vigia); }
  }, 400);
  cena.addEventListener('arError', () => {
    document.querySelector('#carregando h2').textContent = 'CÂMERA BLOQUEADA';
    document.querySelector('#carregando p').innerHTML =
      'Libere a câmera: toque no cadeado ao lado do endereço → <b>Permissões</b> → <b>Câmera: Permitir</b> e recarregue a página.';
  });
</script>
</body>
</html>
